<style>
/* R&A home: sign-in, the app launcher, and settings (account, display, accounts & access). */
:root{
  --bg:#F3EFE6; --surface:#FFFDF8; --surface2:#EAE4D7; --ink:#17181C; --on-ink:#F3EFE6; --muted:#5F5A50;
  --line:rgba(23,24,28,.12); --line-strong:rgba(23,24,28,.26); --field:#FFFFFF;
  --accent:#C2452D; --on-accent:#FFFFFF; --accent-fg:#A93A24; --accent-soft:#F6DDD4;
  --info-bg:#E2E7EE; --info-fg:#24384F; --warn-bg:#F7E3C7; --warn-fg:#6B3B00; --good:#2F6B4A;
  --f-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --surface:#1B1D21; --surface2:#24262B; --ink:#EEEAE1; --on-ink:#121316; --muted:#A9A397;
  --line:rgba(238,234,225,.12); --line-strong:rgba(238,234,225,.26); --field:#1F2125;
  --accent:#D9573C; --on-accent:#FFFFFF; --accent-fg:#F08C73; --accent-soft:#3A221C;
  --info-bg:#1E2833; --info-fg:#B9CBE0; --warn-bg:#3A2A14; --warn-fg:#F2C98C; --good:#7FC29B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1B1D21; --surface2:#24262B; --ink:#EEEAE1; --on-ink:#121316; --muted:#A9A397;
  --line:rgba(238,234,225,.12); --line-strong:rgba(238,234,225,.26); --field:#1F2125;
  --accent:#D9573C; --on-accent:#FFFFFF; --accent-fg:#F08C73; --accent-soft:#3A221C;
  --info-bg:#1E2833; --info-fg:#B9CBE0; --warn-bg:#3A2A14; --warn-fg:#F2C98C; --good:#7FC29B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1040px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
@media (min-width:600px){.wrap{padding-left:32px;padding-right:32px;padding-top:28px;gap:28px}}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.top .grow{flex:1;min-width:0}
.mark{display:block;width:72px;height:42px;flex:none;background:url(icons/logo-on-light.svg) center/contain no-repeat}
/* R&A logo: the #1C1C1C-striped version on light backgrounds, the default white-striped version on dark. */
:root[data-theme="dark"] .mark{background-image:url(icons/logo-on-dark.svg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark{background-image:url(icons/logo-on-dark.svg)}}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:400 40px/1.02 var(--f-display);margin:0;letter-spacing:-.005em;text-wrap:balance}
@media (min-width:600px){h1{font-size:52px}}
h2{font:400 28px/1.1 var(--f-display);margin:0}
h3{font:600 15px var(--f-body);margin:0}
.sub{color:var(--muted);margin:0}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--surface2)}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15px}
.btn:disabled{opacity:.55;cursor:default}
.btn.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.danger{background:transparent;color:var(--accent-fg);border:1px solid var(--accent)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--accent-fg);font-weight:600;cursor:pointer;min-height:44px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group > * + *{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:transparent;border:0;text-align:left;color:inherit;text-decoration:none;font-size:15px}
button.item,a.item{cursor:pointer}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chev{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14px;background:var(--info-bg);color:var(--info-fg)}
.notice.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.admin{background:var(--ink);color:var(--on-ink)}
.pill.client{background:var(--info-bg);color:var(--info-fg)}
.pill.guest{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--muted)}

/* home */
.hello{display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-template-columns:1fr;gap:14px}

.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:22px;text-decoration:none;color:var(--tile-fg);background:var(--tile-bg);min-height:190px;overflow:hidden;transition:transform .12s ease}
.tile:active{transform:scale(.985)}
.tile .tl{display:flex;align-items:center;gap:12px}
.tile .tl img{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tile .eb{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.tile .nm{font:400 30px/1.05 var(--f-display)}

.tile .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.tile .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t-otm{--tile-bg:#24352A;--tile-fg:#EDE3C8}
.t-sbm{--tile-bg:#FF8CC6;--tile-fg:#3A1029}
.t-farm{--tile-bg:#2E6A4E;--tile-fg:#F4F8F5}
:root[data-theme="dark"] .t-sbm{--tile-bg:#5A1A43;--tile-fg:#FFF0F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-sbm{--tile-bg:#5A1A43;--tile-fg:#FFF0F7}}
.tile.soon{background:transparent;border:1.5px dashed var(--line-strong);color:var(--muted);min-height:120px;justify-content:center}
.pwcard{background:var(--accent-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}

/* sign-in */
.signin{max-width:420px;width:100%;margin:0 auto;min-height:calc(100dvh - 80px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.sihead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:6px}
.sihead .mark{width:170px;height:99px;margin-bottom:10px}
form.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.in{min-height:48px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--field);color:var(--ink);font-size:16px;font-weight:400}
.in.code{letter-spacing:.3em;font-family:var(--f-mono);text-align:center;font-size:20px}
.pwwrap{display:flex;gap:6px;align-items:center}
.pwwrap .in{flex:1}
.sidivider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.sidivider::before,.sidivider::after{content:"";flex:1;height:1px;background:var(--line-strong)}

/* settings */
.setsplit{display:flex;flex-direction:column;gap:20px}
@media (min-width:760px){.setsplit{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:28px;align-items:start}}
.setmenu{display:flex;flex-direction:column;gap:8px;min-width:0}
.setg{margin:10px 4px 0}
.setg:first-child{margin-top:0}
.setrow{min-height:58px;gap:14px}
.setrow[aria-current="page"]{background:var(--accent-soft)}
.seticon{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center}
.seticon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setsum{flex:none;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.setdetail{display:flex;flex-direction:column;gap:12px;min-width:0}
.sethd{margin:12px 2px 0;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface2);border-radius:12px;padding:3px;min-width:200px}
.seg button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.acct .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.acct .who b{font-weight:600}
.acct .apps{font-size:12.5px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:14px;padding:16px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.cb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--field);cursor:pointer;font-weight:500;font-size:14px}
.cb input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.cb.dis{opacity:.55;cursor:default}
.tierhelp{display:grid;gap:8px;font-size:13.5px}
.tierhelp div{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.tierhelp .pill{justify-self:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
.empty{border:1.5px dashed var(--line-strong);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
</style>
</head>

/* ---------- theme ---------- */

/* ---------- auth ---------- */

async function loadAccounts(){
  var r=await timed(S.sb.from('accounts').select('email,name,role,apps,added_at').order('role').order('name'),15000).catch(function(e){return {error:e};});
  if(r.error){toast('Couldn’t load accounts. Check your connection.');return;}
  S.accounts=r.data||[]; render();
}
async function saveAccount(f){
  var email=(f.email||'').trim().toLowerCase(), name=(f.name||'').trim(), role=f.role, apps=role==='admin'?APPS.map(function(a){return a.id;}):f.apps;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Enter a full email address.');return;}
  if(role!=='admin'&&!apps.length){toast('Pick at least one app.');return;}
  S.ui.busy=true;render();
  var q=f.isNew?S.sb.from('accounts').insert({email:email,name:name||null,role:role,apps:apps,added_by:S.me.email})
              :S.sb.from('accounts').update({name:name||null,role:role,apps:apps}).eq('email',f.orig);
  var r=await timed(q,15000).catch(function(e){return {error:e};});
  S.ui.busy=false;
  if(r.error){toast(/duplicate|unique/i.test(r.error.message||'')?'That email already has an account.':/admin/i.test(r.error.message||'')?'There has to be at least one admin.':'Couldn’t save: '+(r.error.message||'try again')+'.');render();return;}
  S.ui.edit=null; toast(f.isNew?'Account added. They can sign in now.':'Account saved.');
  if(f.orig===S.me.email)await loadMe(); await loadAccounts();
}
async function removeAccount(email){
  if(S.ui.arm!==email){S.ui.arm=email;render();setTimeout(function(){if(S.ui.arm===email){S.ui.arm=null;render();}},4000);return;}
  S.ui.arm=null;S.ui.busy=true;render();
  var r=await timed(S.sb.from('accounts').delete().eq('email',email),15000).catch(function(e){return {error:e};});
  S.ui.busy=false;
  if(r.error){toast(/admin/i.test(r.error.message||'')?'There has to be at least one admin.':'Couldn’t remove it. Try again.');render();return;}
  S.ui.edit=null;toast('Access removed.');loadAccounts();
}

var lastHtml='';
function render(){
  var r=route(), h;
  if(S.state==='signedout')h=viewSignIn();
  else if(S.state==='loading')h='<div class="wrap"><div class="signin"><div class="sihead">'+MARK+'<p class="sub">Loading…</p></div></div></div>';
  else if(S.state==='denied')h=viewDenied();
  else if(S.state==='offline')h=viewMsg('Can’t start','The sign-in library didn’t load. Check your connection.');
  else if(S.state==='error')h=viewMsg('Can’t reach R&amp;A','Check your connection.');
  else h=r.v==='settings'?viewSettings():viewHome();
  if(h===lastHtml)return; lastHtml=h;
  var keep=document.activeElement&&document.activeElement.id, val=keep&&document.activeElement.value;
  $('view').innerHTML=h;
  if(keep&&$(keep)){var el=$(keep);if(val!=null&&el.value!==val&&el.type!=='checkbox')el.value=val;try{el.focus();}catch(e){}}
}

  if(k==='pw'){var e0=($('si-email').value||'').trim(),p0=$('si-pw').value||'';if(e0&&p0)signInPassword(e0,p0);}

  if(k==='code'){var c=($('si-code').value||'').replace(/\D/g,'');if(c)verifyCode(c);}

  if(a==='mode-pw'){S.signin={email:S.signin.email,sent:false,busy:false,msg:'',mode:'password'};render();}
